general.import = [ "~/.config/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
# Deliberately decoupled from `omarchy display text size` (12px shell there
# would anchor this to 9pt): 12px shell is the comfortable UI size, but its
# 9pt terminal anchor is too small, so this is pinned to 11pt independently.
# Touching that slider/CLI again will silently overwrite this back down to
# its anchor value -- rerun ~/.local/bin/fix-terminal-font-size to restore.
size = 11

# Alternates tried previously:
#[font]
#normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
#bold = { family = "FiraCode Nerd Font Mono", style = "Bold" }
#italic = { family = "FiraCode Nerd Font Mono", style = "Regular" }
#size = 11

#[font]
#normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
#bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
#italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
#size = 12

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" },
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" }
]
